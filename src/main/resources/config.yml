# RoyalRegen configuration
#
# Blocks listed in a zone can be harvested and come back on a timer. Everything
# else in the zone stays protected: the block list is the permission.
# Apply changes with /royalregen reload. /royalregen status shows what is loaded.
#
# The zones below are examples and ship disabled. Set your own corners (F3 screen
# or a WorldEdit selection, in any order), then set enabled: true.
# Leave out min and max to cover the whole world. That suits crops; give corners
# to anything that is also a building material (logs, stone).
#
# Economy: a zone is an infinite source. Throttle it with regen-seconds, priced
# against what the item sells for per hour of harvesting. Don't throttle with
# 'drops': overriding drops stops BlockDropItemEvent, so Fortune, telekinesis and
# drop multipliers silently stop working.

# true:  keep your protection plugin denying breaks; RoyalRegen revives harvests
#        of listed blocks. No setup, but plugins that skip cancelled breaks may
#        miss harvests, and a break an anti-cheat cancelled is revived too.
# false: open protection for each zone's area (e.g. a WorldGuard region allowing
#        block-break) and let RoyalRegen deny there. Recommended where you can.
override-protection: true

# For logs with 'fell: true': breaking one brings the rest of the connected tree
# down, a few logs per tick, and never past the edge of the zone.
felling:
  # Permission needed to fell. Empty ("") lets everyone.
  permission: royalregen.fell
  # Most logs a single felling breaks.
  limit: 250
  # Logs broken per tick. Lower looks smoother.
  per-tick: 6

zones:

  # Example 1: a public farm players may harvest but not rebuild.
  example-farm:
    enabled: false
    world: hub

    # Shown when a player walks in.
    display-name: "&aExample Field"
    discovery:
      enabled: true
      # Shown on the first visit; later visits show the display name.
      title: "&6&lExample Field"
      subtitle: "&7Farming region discovered"

    # Opposite corners, inclusive. Give Y a generous range on uneven ground: blocks
    # outside it won't regenerate.
    min: {x: 0,   y: 60,  z: 0}
    max: {x: 100, y: 120, z: 100}

    # How long until a harvested block returns. Decimals are fine.
    regen-seconds: 45

    # Only these are harvestable here. Per-block options, all optional:
    #
    #   require-mature  refuse a crop that hasn't finished growing. On by default
    #                   for crops (wheat, carrots, nether wart, cocoa...), off for
    #                   everything else: sugar cane, cactus and bamboo carry an
    #                   age too, but it isn't ripeness.
    #   regen-seconds   this block's own timer, instead of the zone's.
    #   drops           replace the vanilla drops (read the economy note first;
    #                   no perk can multiply replaced drops).
    #   require-leaves  logs: refuse one that isn't part of a living tree, so the
    #                   trees are harvestable and a wall of the same log isn't.
    #   fell            logs: breaking one brings the tree down (see felling:).
    #   placeholder     what stands in the block's place until it comes back, e.g.
    #                   bedrock in a mine. Also settable once for the whole zone
    #                   (zone-level 'placeholder:'); 'none' turns it off for one
    #                   block. Crops ignore it: they regrow from a seedling.
    #   brush           suspicious sand and gravel: what a finished brush pays
    #                   out. See the archaeology example at the bottom.
    blocks:
      minecraft:wheat:
        require-mature: true
      minecraft:carrots:
        require-mature: true
      minecraft:potatoes:
        require-mature: true
      minecraft:beetroots:
        require-mature: true

  # Example 2: a public mine, with a longer timer because ore is worth more.
  example-mine:
    enabled: false
    world: hub

    display-name: "&7Example Quarry"
    discovery:
      enabled: true
      title: "&6&lExample Quarry"
      subtitle: "&7Mining region discovered"

    min: {x: 200, y: 10, z: 200}
    max: {x: 260, y: 60, z: 260}

    regen-seconds: 120

    # Mined ore shows as bedrock until it comes back. The placeholder can't be broken.
    placeholder: bedrock

    # Vanilla drops, so Fortune still works.
    blocks:
      minecraft:stone: {}
      minecraft:coal_ore: {}
      minecraft:iron_ore: {}

  # Example 3: archaeology. Suspicious sand and gravel pay out from the table
  # below when brushed, then come back after regen-seconds. Regenerated blocks
  # have no loot table, so this table is the whole reward.
  # Brushing is never revived: with WorldGuard, the zone's region needs
  # block-break, block-place and interact set to allow.
  example-archaeology:
    enabled: false
    world: hub

    display-name: "&aExample Dig Site"
    min: {x: 300, y: 60, z: 300}
    max: {x: 360, y: 90, z: 360}

    regen-seconds: 45
    placeholder: bedrock

    blocks:
      minecraft:suspicious_gravel:
        regen-seconds: 300
        # Leave 'brush' out and brushing this block does nothing at all.
        brush:
          enabled: true
          # Drop whatever vanilla item the brush would pop out (only blocks that
          # were generated with a loot table have one). Default true.
          replace-vanilla-loot: true
          # Percentage points added to the chance of every drop marked 'bonus: true'.
          # The key is the held item's EcoItems id (ecoitems:<id>) when it is an
          # EcoItem, otherwise its own key. A tool not listed adds nothing.
          tools:
            minecraft:brush: 0
            ecoitems:archaeologists_brush: 1
            ecoitems:master_brush: 2
          # Every drop is rolled on its own, so one brush can pay several or none.
          # 'chance' is a percent. Commands run as the console, with %player%
          # %uuid% %x% %y% %z% %above_y% %world% and %tool% filled in. %x% %y% %z%
          # are the brushed block, which becomes the placeholder: spawn things at
          # %above_y%, not %y%, or they appear inside it.
          drops:
            - chance: 4
              bonus: true
              commands: ["give %player% minecraft:clay_ball 1"]
            - chance: 2
              commands: ["give %player% minecraft:emerald 1"]
          # Rolled once per finished brush, e.g. for a mini-boss.
          rare-event:
            chance: 0.2
            commands: ["say %player% unearthed something at %x% %above_y% %z%"]
      minecraft:suspicious_sand:
        regen-seconds: 300
        brush:
          enabled: true
          drops:
            - chance: 3
              bonus: true
              commands: ["give %player% minecraft:gold_nugget 1"]
