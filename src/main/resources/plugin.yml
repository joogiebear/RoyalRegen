name: RoyalRegen
version: ${version}
main: com.mystipixel.royalregen.RoyalRegenPlugin
api-version: '26.2'
author: Mystipixel
description: Regenerating blocks in defined zones, so farms and mines can be harvested without being destroyed.
# Loaded after WorldGuard where present, so this plugin's listener can carve out its exception.
softdepend:
  - WorldGuard
commands:
  royalregen:
    description: RoyalRegen admin tools.
    usage: /royalregen reload|status|pos1|pos2|create <id> [regen-seconds]
    aliases: [rregen, regen]
permissions:
  royalregen.admin:
    description: Reload RoyalRegen and view its status.
    default: op
  royalregen.fell:
    description: Bring a whole tree down by breaking one of its logs.
    default: false
  royalregen.bypass:
    description: Edit a zone's protected blocks without switching to creative.
    default: op
